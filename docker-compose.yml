networks:
  internal:
    driver: bridge
  # docker-class의 pg-stock과 호스트 포트 공개 없이 직접 통신한다.
  ohlcv-db:
    external: true
    name: postgresql_default

services:

  # ── 프론트엔드 (Nginx + 정적 파일) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: crypto-mock-frontend
    networks:
      - internal
    ports:
      # 호스트 포트는 .env의 FRONTEND_PORT로 바꿀 수 있다(기본 3333).
      - "${FRONTEND_PORT:-3333}:80"
    depends_on:
      - python-backend
    restart: unless-stopped

  # ── MariaDB (로컬 개발용 컨테이너 DB) ─────────────────────────
  mariadb:
    image: mariadb:11.4
    container_name: crypto-mock-mariadb
    profiles: ["local-db"]
    networks:
      - internal
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mockinv}
      MARIADB_USER: ${MARIADB_USER:-mockinv}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-12345678!!}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-12345678!!}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./database/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # PostgreSQL is dedicated to quant OHLCV, strategies, fills and metrics.
  postgres:
    image: postgres:16-alpine
    container_name: crypto-mock-postgres
    profiles: ["local-db"]
    networks:
      - internal
    environment:
      POSTGRES_DB: ${QUANT_DB_NAME:-quant_research}
      POSTGRES_USER: ${QUANT_DB_USER:-quant}
      POSTGRES_PASSWORD: ${QUANT_DB_PASSWORD:-quant}
    volumes:
      - postgres-quant-data:/var/lib/postgresql/data
      - ./database/quant-postgres.sql:/docker-entrypoint-initdb.d/10-quant-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Python 백엔드 (Flask REST API — 코인/주식/회원/관리자/AI 전부 처리) ──
  python-backend:
    build:
      context: .
      dockerfile: docker/python-backend.Dockerfile
    container_name: crypto-mock-python
    networks:
      - internal
      - ohlcv-db
    expose:
      - "8200"
    environment:
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${MARIADB_DATABASE:-mockinv}
      DB_USER: ${MARIADB_USER:-mockinv}
      DB_PASSWORD: ${MARIADB_PASSWORD:-12345678!!}
      QUANT_DATABASE_URL: ${QUANT_DATABASE_URL:-postgresql+psycopg://${QUANT_DB_USER:-quant}:${QUANT_DB_PASSWORD:-quant}@postgres:5432/${QUANT_DB_NAME:-quant_research}}
      # docker-class의 pg-stock은 백테스트 데이터 집계 API에서 읽기 전용으로만 사용한다.
      OHLCV_DATABASE_URL: ${OHLCV_DATABASE_URL:-postgresql+psycopg://admin:admin1234@pg-stock:5432/admin}
      OHLCV_SYNC_ENABLED: ${OHLCV_SYNC_ENABLED:-true}
      OHLCV_SYNC_TICKERS: ${OHLCV_SYNC_TICKERS:-major}
      OHLCV_SYNC_PROVIDER: ${OHLCV_SYNC_PROVIDER:-naver}
      OHLCV_SYNC_START_YEAR: ${OHLCV_SYNC_START_YEAR:-2020}
      OHLCV_SYNC_CORRECTION_DAYS: ${OHLCV_SYNC_CORRECTION_DAYS:-7}
      OHLCV_SYNC_HOUR: ${OHLCV_SYNC_HOUR:-18}
      OHLCV_SYNC_MINUTE: ${OHLCV_SYNC_MINUTE:-20}
      OHLCV_RECONCILE_ENABLED: ${OHLCV_RECONCILE_ENABLED:-true}
      OHLCV_RECONCILE_DAY: ${OHLCV_RECONCILE_DAY:-sun}
      OHLCV_RECONCILE_HOUR: ${OHLCV_RECONCILE_HOUR:-3}
      OHLCV_RECONCILE_MINUTE: ${OHLCV_RECONCILE_MINUTE:-20}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CMC_API_KEY: ${CMC_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # ARIA 암복호화 예제(/api/aria)의 서버 기본 키. 비우면 데모용 고정 키를 쓴다.
      ARIA_DEMO_KEY: ${ARIA_DEMO_KEY:-}
      # 모든 인증정보는 저장소 루트 .env에서만 읽는다.
      # KIS_PAPER_ACCOUNT_NO는 'CANO-계좌상품코드'(예: 12345678-01) 형식이다.
      KIS_ENVIRONMENT: ${KIS_ENVIRONMENT:-paper}
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
      KIS_PAPER_ACCOUNT_NO: ${KIS_PAPER_ACCOUNT_NO:-}
      KIS_PAPER_MAX_ORDER_AMOUNT: ${KIS_PAPER_MAX_ORDER_AMOUNT:-10000000}
      KIS_PAPER_MAX_ORDER_QUANTITY: ${KIS_PAPER_MAX_ORDER_QUANTITY:-1000}
      # 실전 잔고조회 전용. 모의 키와 절대 혼용하지 않으며 주문 API에서는 사용하지 않는다.
      KIS_REAL_APP_KEY: ${KIS_REAL_APP_KEY:-}
      KIS_REAL_APP_SECRET: ${KIS_REAL_APP_SECRET:-}
      KIS_REAL_ACCOUNT_NO: ${KIS_REAL_ACCOUNT_NO:-}
      KIS_REAL_OWNER_EMAIL: ${KIS_REAL_OWNER_EMAIL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      KB_APP_KEY: ${KB_APP_KEY:-}
      KB_APP_SECRET: ${KB_APP_SECRET:-}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      # 비우면 qdrant_service.py가 인메모리 Qdrant를 사용한다.
      QDRANT_URL: ${QDRANT_URL:-:memory:}
      # 자격증명 출처 선택. 비우면(로컬) .env의 브로커 키/키파일을 쓰고,
      # 서버 배포에서 aws로 두면 alpaca 등은 AWS Secrets Manager에서 읽는다.
      CREDENTIAL_SOURCE: ${CREDENTIAL_SOURCE:-}
      # Secrets Manager 트랙(aws_secret_store.py, *_aws.py)에서만 사용한다. EC2에
      # IAM 인스턴스 프로파일이 붙어 있으면 액세스 키 3종은 비워 둬도 된다.
      AWS_REGION: ${AWS_REGION:-}
      AWS_SECRETS_MANAGER_PREFIX: ${AWS_SECRETS_MANAGER_PREFIX:-stock-coin-trade}
      AWS_SECRETS_MANAGER_KMS_KEY_ID: ${AWS_SECRETS_MANAGER_KMS_KEY_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # 기존 회원·보유자산을 변경하지 않고 없는 샘플 투자자만 추가한다.
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
    volumes:
      # AI Sheet의 "LEAN" 버튼: 호스트 Docker 데몬에 접근해 QuantConnect LEAN
      # 컨테이너를 직접 실행한다(Docker-outside-of-Docker). 빌드 컨텍스트는
      # 읽기 전용으로, 실행 데이터/결과는 LEAN 컨테이너와 이름으로 공유하는
      # named volume로 주고받는다(호스트 경로를 몰라도 되어 이식성이 좋다).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/lean:/lean-src:ro
      - lean-data:/lean-data
      - lean-results:/lean-results
    restart: unless-stopped

volumes:
  mariadb-data:
  postgres-quant-data:
  # 이름을 고정해 python-backend가 `docker run -v lean-data:...`로 호스트
  # 데몬에 직접 실행을 요청할 때도(Compose 프로젝트 접두사 없이) 같은
  # 볼륨을 가리키게 한다.
  lean-data:
    name: lean-data
  lean-results:
    name: lean-results
