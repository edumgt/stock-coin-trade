networks:
  internal:
    driver: bridge

services:

  # ── 프론트엔드 (Nginx + 정적 파일) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: crypto-mock-frontend
    networks:
      - internal
    ports:
      - "3000:80"
    depends_on:
      - python-backend
    restart: unless-stopped

  # ── MariaDB (로컬 개발용 컨테이너 DB) ─────────────────────────
  mariadb:
    image: mariadb:11.4
    container_name: crypto-mock-mariadb
    profiles: ["local-db"]
    networks:
      - internal
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mockinv}
      MARIADB_USER: ${MARIADB_USER:-mockinv}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-12345678!!}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-12345678!!}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./database/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # PostgreSQL is dedicated to quant OHLCV, strategies, fills and metrics.
  postgres:
    image: postgres:16-alpine
    container_name: crypto-mock-postgres
    profiles: ["local-db"]
    networks:
      - internal
    environment:
      POSTGRES_DB: ${QUANT_DB_NAME:-quant_research}
      POSTGRES_USER: ${QUANT_DB_USER:-quant}
      POSTGRES_PASSWORD: ${QUANT_DB_PASSWORD:-quant}
    volumes:
      - postgres-quant-data:/var/lib/postgresql/data
      - ./database/quant-postgres.sql:/docker-entrypoint-initdb.d/10-quant-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Python 백엔드 (Flask REST API — 코인/주식/회원/관리자/AI 전부 처리) ──
  python-backend:
    build:
      context: .
      dockerfile: docker/python-backend.Dockerfile
    container_name: crypto-mock-python
    networks:
      - internal
    expose:
      - "8200"
    environment:
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${MARIADB_DATABASE:-mockinv}
      DB_USER: ${MARIADB_USER:-mockinv}
      DB_PASSWORD: ${MARIADB_PASSWORD:-12345678!!}
      QUANT_DATABASE_URL: ${QUANT_DATABASE_URL:-postgresql+psycopg://${QUANT_DB_USER:-quant}:${QUANT_DB_PASSWORD:-quant}@postgres:5432/${QUANT_DB_NAME:-quant_research}}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CMC_API_KEY: ${CMC_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # AWS SSM Parameter Store 연동 트랙(aws_secret_store.py, *_aws.py)에서만
      # 사용한다. kis.key/kb.key/al.key 기반 기존 모듈에는 영향이 없다. EC2에
      # IAM 인스턴스 프로파일이 붙어 있으면 액세스 키 3종은 비워 둬도 된다.
      AWS_REGION: ${AWS_REGION:-}
      AWS_SSM_PARAMETER_PREFIX: ${AWS_SSM_PARAMETER_PREFIX:-/stock-coin-trade}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # 기존 회원·보유자산을 변경하지 않고 없는 샘플 투자자만 추가한다.
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
    # 키 파일은 이미지에 복사하지 않고 읽기 전용으로만 전달한다.
    volumes:
      - ./al.key:/run/secrets/al.key:ro
      - ./kb.key:/run/secrets/kb.key:ro
      - ./kis.key:/run/secrets/kis.key:ro
      # AI Sheet의 "LEAN" 버튼: 호스트 Docker 데몬에 접근해 QuantConnect LEAN
      # 컨테이너를 직접 실행한다(Docker-outside-of-Docker). 빌드 컨텍스트는
      # 읽기 전용으로, 실행 데이터/결과는 LEAN 컨테이너와 이름으로 공유하는
      # named volume로 주고받는다(호스트 경로를 몰라도 되어 이식성이 좋다).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/lean:/lean-src:ro
      - lean-data:/lean-data
      - lean-results:/lean-results
    restart: unless-stopped

volumes:
  mariadb-data:
  postgres-quant-data:
  # 이름을 고정해 python-backend가 `docker run -v lean-data:...`로 호스트
  # 데몬에 직접 실행을 요청할 때도(Compose 프로젝트 접두사 없이) 같은
  # 볼륨을 가리키게 한다.
  lean-data:
    name: lean-data
  lean-results:
    name: lean-results
