# AWS 운영 전용 nginx 설정 (TLS 종단).
# docker-compose.ssl.yml 오버레이가 이 파일을 컨테이너의
# /etc/nginx/conf.d/default.conf 로 마운트한다. 로컬 개발은 이 파일을 쓰지
# 않고 이미지에 내장된 docker/nginx.conf(HTTP 전용)를 그대로 사용한다.

# ── HTTP(80): ACME 갱신 통로만 열고 나머지는 HTTPS로 리다이렉트 ──────────
server {
    listen 80;
    server_name st.edumgt.co.kr;

    # Let's Encrypt webroot 갱신(certbot renew --webroot)이 사용한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS(443): 실제 서비스 ───────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name st.edumgt.co.kr;

    ssl_certificate     /etc/letsencrypt/live/st.edumgt.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/st.edumgt.co.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Python BE API 프록시 (같은 origin 처리로 CORS 불필요)
    location /api/ {
        proxy_pass         http://python-backend:8200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        # AI Sheet의 LEAN 백테스트(Docker로 QuantConnect LEAN 엔진 실행)는
        # .NET 콜드 스타트 때문에 기본 60초보다 오래 걸릴 수 있다.
        proxy_read_timeout 200s;
    }

    # Open API (외부 연동, API Key 인증 — 세션 쿠키 불필요)
    location /openapi/ {
        proxy_pass         http://python-backend:8200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # 업비트 API/웹소켓을 같은 origin으로 중계한다.
    location /upbit-api/ {
        rewrite ^/upbit-api/(.*)$ /v1/$1 break;
        proxy_pass         https://api.upbit.com;
        proxy_ssl_server_name on;
        proxy_set_header   Host api.upbit.com;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location = /upbit-websocket {
        proxy_pass         https://api.upbit.com/websocket/v1;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header   Host api.upbit.com;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Origin "";
    }

    # 메뉴 구조가 바뀌었을 때 이전 common.js가 브라우저에 남지 않게 한다.
    location = /js/common.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # .html 생략 가능 + SPA fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
