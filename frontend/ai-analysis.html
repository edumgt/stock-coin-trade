<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI 시장 분석 — 모의투자</title><script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260911-ui-system"><style>.wide{max-width:none;margin:0;padding:30px 0 50px}.card{margin-top:16px;padding:22px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm)}.controls{display:grid;grid-template-columns:150px 120px minmax(260px,1fr) auto;gap:10px}.controls select,.controls input{padding:10px;border:1px solid var(--border);border-radius:8px;font:inherit}.btn{padding:10px 16px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-weight:800;cursor:pointer}.output{min-height:360px;padding:22px;border-radius:10px;background:#fafaff;color:var(--fg);line-height:1.85}.rag{display:none;margin-bottom:14px;padding:15px;border:1px solid #c7d2fe;border-radius:10px;background:#f5f3ff}@media(max-width:760px){.wide{padding:20px 0 30px}.controls{grid-template-columns:1fr}.output{min-height:280px}}</style></head><body><div id="header-mount"></div><main class="wide"><section style="padding:28px;border:1px solid #c9daff;border-radius:14px;background:linear-gradient(135deg,#e6f0ff,#fafcff)"><div style="font-size:12px;font-weight:900;color:#4f46e5;letter-spacing:.08em">AI MARKET ANALYSIS</div><h1 style="margin:6px 0;font-size:29px;font-weight:900">AI 시장 분석</h1><p style="margin:0;color:var(--fg-2)">사이드패널이 아닌 전용 넓은 화면에서 시장 맥락과 지식 베이스 근거를 함께 확인합니다.</p></section><section class="card"><div class="controls"><select id="aiContextSelect"><option value="general">전체 시장</option><option value="stock">주식 시장</option><option value="crypto">코인 시장</option></select><select id="aiRagLimit"><option value="3">근거 3개</option><option value="5" selected>근거 5개</option><option value="8">근거 8개</option></select><input id="marketContextInput" placeholder="분석할 시장 상황·종목·질문 입력 (예: 반도체 업종 변동성 점검)"><button class="btn" id="aiRunBtn" onclick="runAiAnalysis()">분석 시작</button></div><div id="ai-rag-block" class="rag"><b>Qdrant 검색 근거 <span id="rag-hit-count"></span></b><div id="rag-context-list" style="margin-top:10px"></div></div><article id="aiContent" class="output" style="margin-top:16px">분석 조건을 입력하고 <strong>분석 시작</strong>을 선택하세요.</article></section></main><script src="/js/config.js"></script><script src="/js/common.js?v=20260911-gnb"></script><script>document.addEventListener('DOMContentLoaded',()=>initPage())</script></body></html>
