<section class="kb-hero"><h1>KB API 환경 설정</h1><p><strong>역할:</strong> <code>.env</code> 자격 증명과 서버 준비 상태를 확인합니다.</p></section>
<section class="kb-card"><h2>서버 설정 상태</h2><div class="kb-status-grid"><div id="kbConfigured" class="kb-status">○ Key·Secret</div><div id="kbSource" class="kb-status">○ .env 설정</div><div id="kbMount" class="kb-status">○ 환경변수 전달</div><div id="kbPermission" class="kb-status">○ 파일 권한 600</div></div><div id="kbSetupMessage" class="kb-note">로그인 후 서버 설정 상태를 확인합니다.</div><h3>단일 설정 방식</h3><div class="kb-grid"><div class="kb-box"><b>루트 .env</b><p><code>KB_APP_KEY</code>와 <code>KB_APP_SECRET</code>을 함께 설정합니다.</p></div><div class="kb-box"><b>Docker Compose</b><p>Compose가 <code>.env</code> 값을 컨테이너 환경변수로 전달합니다.</p></div><div class="kb-box"><b>보안</b><p><code>chmod 600 .env</code>를 적용하고 Git에 커밋하지 않습니다.</p></div></div><div class="kb-actions"><a class="kb-btn" href="/kb-api-test.html">다음: API 테스트</a><a class="kb-btn secondary" href="/learning/kb-securities.html">전체 커리큘럼</a></div></section>
