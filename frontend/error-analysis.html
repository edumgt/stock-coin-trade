<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>에러분석 — 모의투자</title><link rel="icon" href="/img/favicon.png"><script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260911-ui-system">
  
  <style>.wrap{max-width:1280px;margin:0 auto;padding:30px 18px 50px}.card{margin-top:16px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow-sm)}.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.filters label{display:grid;gap:4px;font-size:12px;font-weight:800;color:var(--fg-2)}select,input{padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--fg);font:inherit;font-size:13px}.btn{padding:9px 13px;border:0;border-radius:7px;background:var(--accent);color:#fff;font-size:13px;font-weight:800;cursor:pointer}.table-wrap{overflow:auto}.logs{width:100%;border-collapse:collapse;font-size:13px}.logs th,.logs td{padding:11px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}.logs th{font-size:11px;color:var(--muted);white-space:nowrap}.logs tr{cursor:pointer}.logs tr:hover{background:var(--surface-2)}.path,.message{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{display:inline-block;padding:3px 6px;border-radius:5px;background:var(--surface-2);font-weight:800;font-size:11px}.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:15px;background:rgba(15,23,42,.42)}.modal.open{display:flex}.detail{width:min(860px,100%);max-height:90vh;overflow:auto;padding:20px;background:#fff;border-radius:13px}.detail pre{margin:7px 0 0;padding:12px;overflow:auto;border-radius:8px;background:#131722;color:#d1d4dc;font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap}.detail dt{margin-top:12px;font-size:12px;font-weight:900;color:var(--fg-2)}.detail dd{margin:3px 0;color:var(--fg);font-size:13px;line-height:1.6}.notice{padding:12px;border-radius:8px;background:#fff8e8;color:#854d0e;font-size:12px;line-height:1.65}@media(max-width:700px){.wrap{padding:20px 11px}.card{padding:14px}.logs{font-size:12px}.logs th:nth-child(4),.logs td:nth-child(4),.logs th:nth-child(5),.logs td:nth-child(5){display:none}}</style>
</head>
<body><div id="header-mount"></div><main class="wrap">
  <section style="padding:27px;border:1px solid #c9daff;border-radius:14px;background:linear-gradient(135deg,#e6f0ff,#fafcff)"><div style="font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--accent-dark)">SYSTEM DIAGNOSTICS</div><h1 style="margin:6px 0;font-size:28px;font-weight:900;color:var(--fg)">에러분석</h1><p style="margin:0;color:var(--fg-2);font-size:14px;line-height:1.7">서버 API 실패와 브라우저 JavaScript 오류를 한 곳에서 확인합니다. 행을 선택하면 원인 설명, 요청 정보와 마스킹된 스택을 볼 수 있습니다.</p></section>
  <section class="card"><div class="filters"><label>발생 주체<select id="source"><option value="">전체</option><option value="SERVER">서버</option><option value="CLIENT">브라우저</option></select></label><label>HTTP 상태<input id="status" inputmode="numeric" placeholder="예: 500" maxlength="3"></label><button class="btn" id="reload">새로고침</button><span id="summary" style="font-size:12px;color:var(--muted)"></span></div><div class="notice" style="margin-top:14px">이 화면은 관리자 전용입니다. 비밀번호·세션 쿠키·API 키·Bearer 토큰은 저장 전에 마스킹합니다. 오류를 해결한 뒤에도 진단 로그는 자동 삭제되지 않습니다.</div></section>
  <section class="card table-wrap"><table class="logs"><thead><tr><th>발생 시각</th><th>주체</th><th>상태</th><th>경로</th><th>오류 유형</th><th>메시지</th></tr></thead><tbody id="rows"><tr><td colspan="6" style="text-align:center;color:var(--muted)">로그를 불러오는 중…</td></tr></tbody></table></section>
</main><div id="modal" class="modal" role="dialog" aria-modal="true"><article class="detail"><div style="display:flex;justify-content:space-between;gap:12px"><h2 style="margin:0;font-size:18px;font-weight:900">오류 상세</h2><button class="btn" id="close">닫기</button></div><dl id="detail"></dl></article></div>
<script src="/js/config.js"></script><script src="/js/common.js?v=20260911-ohlcv-db-menu"></script><script src="/js/error-analysis.js?v=20260911-1"></script></body></html>
