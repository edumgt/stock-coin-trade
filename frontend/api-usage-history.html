<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>API 사용이력 — EDUMGT</title><link rel="icon" href="/img/favicon.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/style.css?v=20260911-ui-system"><script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.2/dist/ag-grid-community.min.js"></script><style>.usage-grid{--ag-font-family:Pretendard,sans-serif;--ag-font-size:13px;--ag-background-color:#fff;--ag-foreground-color:#172033;--ag-header-background-color:#F7F9FC;--ag-header-foreground-color:#64748B;--ag-border-color:#E2E8F0;--ag-row-border-color:#E8EDF4;--ag-odd-row-background-color:#FBFCFE;--ag-selected-row-background-color:#EFF6FF;--ag-accent-color:#2563EB}.usage-grid .ag-header-cell-label{font-weight:800}.usage-grid .ag-cell{display:flex;align-items:center}.usage-refresh{width:auto!important;min-width:0!important;display:inline-flex!important;align-items:center;justify-content:center;flex:0 0 auto;padding:.48rem .85rem!important;font-size:12px!important;white-space:nowrap}.detail{min-height:180px;margin-top:14px;padding:14px;border-radius:9px;background:#111827;color:#e5e7eb;font:12px/1.65 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}</style></head><body><div id="header-mount"></div><main class="w-full px-4 py-6"><section class="glass-card overflow-hidden"><div class="flex items-center justify-between gap-4 px-6 py-5" style="border-bottom:1px solid var(--border)"><div class="min-w-0"><h1 class="text-xl font-black" style="color:var(--fg)">API 사용이력</h1><p class="mt-1 text-xs" style="color:var(--muted)">KIS·KB증권·Alpaca·Binance·Korbit·AWS SSM 테스트 호출의 시간, 결과, 응답을 안전하게 확인합니다.</p></div><button id="usageRefresh" class="btn-ghost usage-refresh" type="button">↻ 새로고침</button></div><div class="flex flex-wrap items-center gap-3 px-4 py-4"><input id="usageFilter" class="dark-input" type="search" placeholder="제공사 · API 경로 · 성공/실패
