<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>지식 데이터셋 — 모의투자</title><script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260911-ui-system"><style>.wide{max-width:none;margin:0;padding:30px 0 50px}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px;margin-top:16px}.card{padding:22px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm)}input,select,textarea{box-sizing:border-box;width:100%;margin-top:7px;padding:10px;border:1px solid var(--border);border-radius:8px;font:inherit}.btn{width:100%;margin-top:10px;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}#qdrant-doc-list{max-height:570px;overflow:auto}@media(max-width:760px){.wide{padding:20px 0 30px}.grid{grid-template-columns:1fr}}</style></head><body><div id="header-mount"></div><main class="wide"><section style="padding:28px;border:1px solid #c9daff;border-radius:14px;background:linear-gradient(135deg,#e6f0ff,#fafcff)"><div style="font-size:12px;font-weight:900;color:var(--accent-dark);letter-spacing:.08em">KNOWLEDGE DATASET</div><h1 style="margin:6px 0;font-size:29px;font-weight:900">지식 데이터셋</h1><p style="margin:0;color:var(--fg-2)">Qdrant 컬렉션 상태, 지식 문서 목록과 추가 기능을 독립 화면에서 관리합니다.</p></section><section class="grid"><article class="card"><h2 style="margin-top:0">컬렉션 상태</h2><div id="qdrant-stats-body">불러오는 중…</div><hr style="margin:20px 0;border:0;border-top:1px solid var(--border)"><h2>새 지식 추가</h2><input id="new-doc-title" placeholder="제목"><select id="new-doc-category"><option value="technical_analysis">기술분석</option><option value="fundamental_analysis">기본분석</option><option value="sector_analysis">섹터분석</option><option value="market_structure">시장구조</option><option value="investment_strategy">투자전략</option><option value="risk_management">리스크 관리</option><option value="custom">기타</option></select><textarea id="new-doc-text" rows="8" placeholder="지식 내용 (최대 2000자)"></textarea><button id="add-doc-btn" class="btn" onclick="addQdrantDoc()">Qdrant에 추가</button><div id="add-doc-msg" style="margin-top:9px"></div></article><article class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">지식 문서 목록</h2><button onclick="loadDataset()" style="border:0;background:none;color:var(--accent-dark);cursor:pointer;font-weight:800">새로고침</button></div><div id="qdrant-doc-list" style="margin-top:15px">불러오는 중…</div></article></section></main><script src="/js/config.js"></script><script src="/js/common.js?v=20260911-ohlcv-db-menu"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await initPage();loadDataset()})</script></body></html>
