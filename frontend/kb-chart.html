<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>KB증권 API 캔들 차트 — EDUMGT</title>
  <link rel="icon" href="/img/favicon.png"><script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260920-chart"><link rel="stylesheet" href="/css/kb-lab.css?v=20260920-1">
  <style>
    .chart-wrap{max-width:1440px;margin:0 auto;padding:24px 18px 54px}.chart-card{margin-top:15px;padding:20px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow-sm)}.chart-head{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:900;color:var(--muted)}.field input,.field select{height:40px;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font:inherit;font-size:13px;font-weight:700}.field input{width:150px}.periods{display:flex;border:1px solid #ddd6fe;border-radius:8px;overflow:hidden}.periods button{height:40px;padding:0 14px;border:0;background:#fff;color:#5b21b6;font-weight:800}.periods button.on{background:#6d28d9;color:#fff}.load{height:40px;padding:0 16px;border:0;border-radius:8px;background:#6d28d9;color:#fff;font-weight:900}.load:disabled{opacity:.6}.source{margin-left:auto;padding:9px 12px;border-radius:8px;background:#f5f3ff;color:#5b21b6;font-size:12px;font-weight:800}#kbChart{height:560px;margin-top:12px;border:1px solid var(--border);border-radius:10px;overflow:hidden}.legend{min-height:24px;color:var(--fg-2);font-size:12px;font-variant-numeric:tabular-nums}.message{margin-top:10px;padding:12px;border-radius:8px;background:#fff1f2;color:#be123c;font-size:13px;display:none}.table-wrap{max-height:360px;overflow:auto;margin-top:12px;border:1px solid var(--border);border-radius:8px}.candles{width:100%;border-collapse:collapse;font-size:12px}.candles th,.candles td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right}.candles th:first-child,.candles td:first-child{text-align:left}.candles th{position:sticky;top:0;background:var(--surface-2)}@media(max-width:760px){#kbChart{height:410px}.source{margin-left:0}.chart-card{padding:14px}}
  </style>
</head>
<body><div id="header-mount"></div><main class="chart-wrap">
  <section class="kb-hero"><h1>KB증권 캔들 차트</h1><p><strong>역할:</strong> KB 통합차트 API의 OHLCV 데이터를 시각화합니다.</p></section>
  <section class="chart-card"><div class="chart-head"><div class="field"><label for="symbol">종목코드</label><input id="symbol" value="005930" maxlength="6" inputmode="numeric"></div><div class="field"><label for="market">시장</label><select id="market"><option value="0">KOSPI</option><option value="1">KOSDAQ</option></select></div><div class="field"><label>주기</label><div id="periods" class="periods"><button data-period="D" class="on">일</button><button data-period="W">주</button><button data-period="M">월</button><button data-period="Y">년</button></div></div><div class="field"><label for="count">캔들 수</label><select id="count"><option value="30">30개</option><option value="60" selected>60개</option><option value="120">120개</option><option value="200">200개</option></select></div><button id="load" class="load">KB 차트 조회</button><span class="source">데이터: KB API IVS11560</span></div><div id="message" class="message"></div></section>
  <section class="chart-card"><div id="legend" class="legend">캔들 위에 마우스를 올리면 OHLCV가 표시됩니다.</div><div id="kbChart"></div><div class="kb-note">시장 구분이 실제 종목과 다르면 KB가 조회 오류를 반환합니다. 삼성전자(005930)는 KOSPI, 에코프로비엠(247540)은 KOSDAQ을 선택하세요. 같은 조건은 30초 동안 서버에서 캐시합니다.</div></section>
  <section class="chart-card"><details><summary style="cursor:pointer;font-weight:900">KB 원천 캔들 표 <small id="rowCount" style="color:var(--muted)"></small></summary><div class="table-wrap"><table class="candles"><thead><tr><th>일자</th><th>시가</th><th>고가</th><th>저가</th><th>종가</th><th>거래량</th><th>거래대금</th></tr></thead><tbody id="candleRows"></tbody></table></div></details></section>
</main><script src="/js/config.js"></script><script src="/js/common.js?v=20260926-navstate4"></script><script src="/js/kb-chart.js?v=20260920-1"></script></body></html>
