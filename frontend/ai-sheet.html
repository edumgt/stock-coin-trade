<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Sheet — EDUMGT</title><link rel="icon" href="/img/favicon.png">
  <style>@font-face{font-family:Pretendard;font-weight:400;src:url('/fonts/Pretendard-Regular.woff2')}@font-face{font-family:Pretendard;font-weight:700;src:url('/fonts/Pretendard-Bold.woff2')}</style>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/style.css?v=20260811-menu-fix-1"><link rel="stylesheet" href="/css/ai-sheet.css?v=20260830-modal-1">
</head>
<body><div id="header-mount"></div>
  <main class="sheet-page">
    <section class="sheet-hero"><h1>AI SHEET — 웹 데이터를 바로 시트로</h1></section>
    <div class="sheet-tabs" role="tablist">
      <button type="button" class="sheet-tab active" id="tab-crawl" role="tab" aria-selected="true" aria-controls="panel-crawl">웹페이지 표 가져오기</button>
      <button type="button" class="sheet-tab" id="tab-sector" role="tab" aria-selected="false" aria-controls="panel-sector">섹터별 월별 종가</button>
    </div>
    <section class="sheet-card" id="panel-crawl" role="tabpanel" aria-labelledby="tab-crawl"><form id="crawl-form" class="crawl-form"><label for="source-url">가져올 페이지 URL</label><div><input id="source-url" type="url" required placeholder="https://example.com/report"><button id="crawl-button" type="submit">시트 만들기</button></div><p>공개 HTML 페이지의 표를 우선 추출합니다. 로그인·차단된 페이지와 PDF는 지원하지 않습니다.</p></form></section>
    <section class="sheet-card" id="panel-sector" role="tabpanel" aria-labelledby="tab-sector" hidden><form id="sector-form" class="crawl-form"><label for="sector-select">섹터별 종목 월별 종가</label><div><select id="sector-select" required><option value="">섹터를 불러오는 중…</option></select><button id="sector-button" type="submit">섹터 시트 만들기</button></div><p>선택한 섹터의 상위 20개 종목을 가져와, 최근 24개월(yyyy-mm)의 월별 종가를 시트로 만듭니다.</p></form></section>
    <section id="sheet-status" class="sheet-status" aria-live="polite">URL을 입력하면 데이터 시트를 만듭니다.</section>
    <section id="sheet-workspace" class="sheet-card workspace" hidden><div class="sheet-toolbar"><div><h2 id="sheet-title"></h2><a id="sheet-source" target="_blank" rel="noopener">원문 열기 ↗</a></div><div><button type="button" id="quant-analyze">퀀트분석</button><button type="button" id="lean-backtest">LEAN</button><button type="button" id="add-row">행 추가</button><button type="button" id="download-csv">CSV 다운로드</button></div></div><div class="table-scroll"><table id="data-sheet"></table></div><p class="sheet-footnote">셀을 클릭해 직접 수정할 수 있습니다. 추출 값은 원문과 대조해 확인하세요.</p></section>
  </main>
  <div id="confirm-modal" class="modal-overlay" hidden>
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-message">
      <p id="confirm-modal-message"></p>
      <div class="modal-actions">
        <button type="button" id="confirm-modal-cancel">취소</button>
        <button type="button" id="confirm-modal-ok">확인</button>
      </div>
    </div>
  </div>
  <footer id="site-footer"><div class="sheet-footer-inner"><span class="brand-logo-text">EDUMGT</span><span>AI Sheet · 공개 웹 데이터는 원문을 확인한 뒤 사용하세요.</span></div></footer>
  <script src="/js/config.js"></script><script src="/js/common.js?v=20260813-common-menu-3"></script><script src="/js/ai-sheet.js?v=20260830-modal-1"></script>
</body></html>
