<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>지식 검색 — 모의투자</title><script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260911-ui-system"><style>.wide{max-width:none;margin:0;padding:30px 0 50px}.card{margin-top:16px;padding:22px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm)}.search{display:flex;gap:9px}.search input{flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;font:inherit}.btn{padding:10px 17px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-weight:800;cursor:pointer}#qdrant-search-results{min-height:360px;margin-top:16px;padding:18px;border-radius:10px;background:#fafaff}@media(max-width:600px){.wide{padding:20px 0 30px}.search{flex-direction:column}}</style></head><body><div id="header-mount"></div><main class="wide"><section style="padding:28px;border:1px solid #c9daff;border-radius:14px;background:linear-gradient(135deg,#e6f0ff,#fafcff)"><div style="font-size:12px;font-weight:900;color:#4f46e5;letter-spacing:.08em">KNOWLEDGE BASE</div><h1 style="margin:6px 0;font-size:29px;font-weight:900">지식 검색</h1><p style="margin:0;color:var(--fg-2)">투자 교육 자료와 사용자가 추가한 문서를 넓은 결과 화면에서 의미 기반으로 검색합니다.</p></section><section class="card"><div class="search"><input id="qdrant-search-input" placeholder="예: RSI 과매수, 하락장 대응, 반도체 투자" onkeydown="if(event.key==='Enter') runQdrantSearch()"><button id="qdrant-search-btn" class="btn" onclick="runQdrantSearch()">검색</button></div><div id="qdrant-search-results">검색어를 입력하세요.</div></section></main><script src="/js/config.js"></script><script src="/js/common.js?v=20260911-gnb"></script><script>document.addEventListener('DOMContentLoaded',()=>initPage())</script></body></html>
