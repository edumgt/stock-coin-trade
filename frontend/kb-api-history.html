<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KB API 호출 이력 — EDUMGT</title><link rel="icon" href="/img/favicon.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/style.css?v=20260920-chart"><link rel="stylesheet" href="/css/kb-lab.css?v=20260920-1"><script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.2/dist/ag-grid-community.min.js"></script><style>.history{max-width:1600px;margin:auto;padding:24px 18px 48px}.head{display:flex;justify-content:space-between;gap:18px;padding:22px 24px;border-bottom:1px solid var(--border)}.head h1{margin:4px 0;font-size:24px;font-weight:900}.head p{margin:0;color:var(--muted);font-size:13px}.refresh{padding:9px 13px;border:1px solid var(--border);border-radius:8px;background:#fff;font-weight:800}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:16px 20px}.sum{padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}.sum small{display:block;color:var(--muted)}.sum b{font-size:21px}.tools{display:flex;gap:9px;flex-wrap:wrap;padding:0 20px 14px}.tools input,.tools select{height:38px;padding:0 11px;border:1px solid var(--border);border-radius:8px}.tools input{min-width:300px}.kb-api-grid{--ag-font-family:Pretendard,sans-serif;--ag-font-size:12px;--ag-header-background-color:#f7f9fc;--ag-border-color:#e2e8f0;--ag-accent-color:#6d28d9}.gridbox,.detailbox{padding:0 20px 18px}.detail{min-height:180px;padding:15px;border-radius:9px;background:#111827;color:#e5e7eb;font:12px/1.65 ui-monospace,monospace;white-space:pre-wrap;max-height:430px;overflow:auto}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.tools input{width:100%;min-width:0}}</style></head><body><div id="header-mount"></div><main class="history"><section class="glass-card overflow-hidden"><header class="head"><div><div class="kb-kicker">KB OPEN API · 6단계</div><h1>KB API 호출·오류 이력</h1><p>로그인한 사용자가 호출한 자체 API와 KB 운영 서버 요청을 함께 표시합니다. Key·Secret·Token은 저장하지 않습니다.</p></div><button id="refresh" class="refresh">↻ 새로고침</button></header><div class="summary"><div class="sum"><small>전체 기록</small><b id="total">0</b></div><div class="sum"><small>KB 외부 호출</small><b id="outbound">0</b></div><div class="sum"><small>외부 성공</small><b id="success">0</b></div><div class="sum"><small>외부 실패</small><b id="failure">0</b></div><div class="sum"><small>평균 응답</small><b id="average">-</b></div></div><div class="tools"><input id="filter" type="search" placeholder="TR · 경로 · 오류 검색"><select id="layer"><option value="">전체 계층</option><option value="내 API">내 API</option><option value="KB 외부 호출">KB 외부 호출</option></select><select id="result"><option value="">전체 결과</option><option value="success">성공</option><option value="failure">실패</option></select><span id="status">불러오는 중…</span></div><div class="gridbox"><div id="grid" class="kb-api-grid" style="height:560px"></div></div><div class="detailbox"><h2 style="font-size:14px;font-weight:900">선택한 호출 상세</h2><pre id="detail" class="detail">행을 선택하면 마스킹된 요청·응답을 표시합니다.</pre></div></section></main><script src="/js/config.js"></script><script src="/js/common.js?v=20260926-navstate3"></script><script src="/js/kb-api-history.js?v=20260920-1"></script></body></html>
