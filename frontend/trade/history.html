<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @font-face { font-family:'Pretendard'; font-weight:400; font-display:swap; src:url('/fonts/Pretendard-Regular.woff2') format('woff2'); }
    @font-face { font-family:'Pretendard'; font-weight:600; font-display:swap; src:url('/fonts/Pretendard-SemiBold.woff2') format('woff2'); }
    @font-face { font-family:'Pretendard'; font-weight:700; font-display:swap; src:url('/fonts/Pretendard-Bold.woff2') format('woff2'); }
    @font-face { font-family:'Pretendard'; font-weight:800; font-display:swap; src:url('/fonts/Pretendard-ExtraBold.woff2') format('woff2'); }
    #site-footer { position:fixed; bottom:0; left:0; right:0; z-index:50; margin-top:0; }
    body { padding-bottom:44px; }
    .history-grid { --ag-font-family:Pretendard, sans-serif; --ag-font-size:13px; --ag-background-color:#fff; --ag-foreground-color:#172033; --ag-header-background-color:#F7F9FC; --ag-header-foreground-color:#64748B; --ag-border-color:#E2E8F0; --ag-row-border-color:#E8EDF4; --ag-odd-row-background-color:#FBFCFE; --ag-selected-row-background-color:#EFF6FF; --ag-accent-color:#2563EB; }
    .history-grid .ag-header-cell-label { font-weight:800; }
    .history-grid .ag-cell { display:flex; align-items:center; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Pretendard','-apple-system','BlinkMacSystemFont','Segoe UI','Apple SD Gothic Neo','Malgun Gothic','sans-serif']}}}}</script>

  <link rel="stylesheet" href="/css/korean-typography.css?v=20261014-ko90-1">
<style>
body.trade-history-page{height:100dvh;min-height:0;padding-bottom:0;overflow:hidden;display:flex;flex-direction:column}body.trade-history-page>#header-mount{flex-shrink:0}body.trade-history-page>main{flex:1;min-height:0;overflow:hidden;padding:10px 14px;display:flex;flex-direction:column}.trade-history-page .history-panel{display:flex;flex-direction:column;flex:1;min-height:0}.trade-history-page .history-panel>div:not(.history-grid-container){flex-shrink:0}.trade-history-page .history-grid-container{flex:1;min-height:0;padding:0 12px 10px}.trade-history-page #historyGrid{min-height:0}.trade-history-page>footer,.trade-history-page #site-footer{position:static!important;flex-shrink:0!important;margin:0!important}.history-toolbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border)}.history-toolbar h1{margin:0;font-size:18px;font-weight:900;white-space:nowrap;color:var(--fg)}.history-toolbar #historyQuickFilter{width:clamp(200px,26vw,360px);min-width:0;padding:8px 10px;font-size:13px}.history-toolbar #historyStatus{flex:1;min-width:0;font-size:12px;line-height:1.5;color:var(--muted)}.history-toolbar-actions{display:flex;gap:8px;margin-left:auto}.history-toolbar-actions button{white-space:nowrap;padding:8px 12px;font-size:13px}.trade-history-page .history-summary{grid-template-columns:repeat(3,minmax(0,1fr));padding:8px 12px;gap:8px}.trade-history-page .stat-card{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 12px;min-width:0;box-shadow:none}.trade-history-page .stat-card .stat-label{font-size:12px;white-space:nowrap}.trade-history-page .stat-card .stat-value{font-size:18px;margin:0;white-space:nowrap}@media(max-width:1000px){.history-toolbar{flex-wrap:wrap;gap:8px}.history-toolbar #historyStatus{order:3;flex-basis:100%}.history-toolbar #historyQuickFilter{flex:1}.trade-history-page .stat-card{flex-direction:column;gap:3px}.trade-history-page .stat-card .stat-value{font-size:16px}}@media(max-width:600px){body.trade-history-page>main{padding:6px}.history-toolbar{padding:8px 10px}.history-toolbar h1{font-size:16px}.history-toolbar-actions{order:1}.history-toolbar #historyQuickFilter{order:2;flex-basis:100%;width:100%}.history-toolbar #historyStatus{font-size:11px}.history-toolbar-actions button{padding:6px 9px;font-size:12px}.trade-history-page .history-summary{padding:6px;gap:5px}.trade-history-page .stat-card{padding:7px 6px}.trade-history-page .stat-card .stat-label{font-size:10px}.trade-history-page .stat-card .stat-value{font-size:13px}.trade-history-page .history-grid-container{padding:0 6px 6px}}@media(max-height:480px){.history-toolbar{padding:5px 10px;gap:6px}.history-toolbar #historyQuickFilter{padding:4px 8px}.history-toolbar #historyStatus{order:0;flex-basis:auto;font-size:10px}.trade-history-page .history-summary{padding:4px 8px}.trade-history-page .stat-card{flex-direction:row;padding:4px 8px}.trade-history-page .stat-card .stat-value{font-size:13px}.trade-history-page .history-grid-container{padding-bottom:4px}}
</style><script defer src="/js/compact-typography.js?v=20261022-92"></script>
</head>
<body class="min-h-screen trade-history-page">
<div id="header-mount"></div>
<main class="w-full px-4 py-6">
  <section class="glass-card overflow-hidden history-panel">
    <div class="history-toolbar">
      <h1 title="주식·코인·대체자산의 체결 내역 조회·정렬·필터·CSV 저장">내 거래이력</h1>
      <input id="historyQuickFilter" type="search" aria-label="거래이력 검색" placeholder="자산 · 종목명 · 코드 · 매수/매도 검색" class="dark-input">
      <span id="historyStatus" role="status"></span>
      <div class="history-toolbar-actions"><button id="historyRefreshBtn" type="button" class="btn-ghost">↻ 새로고침</button><button id="historyCsvBtn" type="button" class="btn-buy">CSV 저장</button></div>
    </div>

    <div class="grid grid-cols-1 gap-3 p-4 sm:grid-cols-3 history-summary">
      <div class="stat-card"><div class="stat-label">전체 체결</div><div class="stat-value"><span id="historyTotalCount">-</span><span style="font-size:13px;font-weight:500;color:var(--muted);margin-left:4px;">건</span></div></div>
      <div class="stat-card"><div class="stat-label">누적 매수금액</div><div class="stat-value" id="historyBuyAmount">-</div></div>
      <div class="stat-card"><div class="stat-label">누적 매도금액</div><div class="stat-value" id="historySellAmount">-</div></div>
    </div>

    <div class="px-4 pb-5 history-grid-container">
      <div id="historyGrid" class="history-grid" style="height:100%;width:100%;"></div>
    </div>
  </section>
</main>
<footer class="site-footer-unified">© 2026 (주)에듀엠지티 All rights reserved.</footer>
<script src="/js/config.js"></script>
<script src="/js/common.js?v=20261008-footer-25px"></script>
<script src="/js/trade-history.js?v=20261020-fit-grid"></script>
</body>
</html>
