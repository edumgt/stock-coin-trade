[project]
name = "stock-coin-trade-backend"
version = "2.0.0"
description = "주식·암호화폐 모의투자 및 OpenAPI 학습 플랫폼 백엔드 (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0.35",
    "PyMySQL>=1.1.1",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.1",
    "itsdangerous>=2.2",
    "bcrypt>=4.2.0",
    "APScheduler>=3.10.4,<4",
    "requests>=2.32.3",
    "boto3>=1.35.36",
    "python-dotenv>=1.0.1",
    "yfinance>=0.2.54",
    "pandas>=2.2",
    "scikit-learn>=1.5.2",
    "qdrant-client[fastembed]>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501", "B008", "B904", "SIM102", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
